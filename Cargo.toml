[package]
name = "nelody-seq"
version = "1.2.0"
edition = "2021"
rust-version = "1.88"
description = "Algorithmic melodic MIDI sequencer plug-in (CLAP/VST3), Rust-based"
license = "GPL-3.0-or-later"
build = "build.rs"

[lib]
crate-type = ["cdylib", "lib"]

[features]
# Debug builds abort if `process()` allocates (invariant #1 in AGENTS.md). Off by default: it
# installs a global allocator, and it conflicts with the counting allocator used by the tests.
assert_process_allocs = ["nice-plug/assert_process_allocs"]

[dependencies]
# Pinned to a fork commit: the upstream API line has no release compatible with the vendored
# slint-baseview (crates.io 0.4.x uses a different baseview 0.4 editor API). The fork adds the
# state-rescan/state-size guards and the VST3 pre-setup activation tolerance. See
# docs/ARCHITECTURE.md and docs/HOST_VERIFICATION.md.
nice-plug = { git = "https://github.com/ccne4mocc/nice-plug.git", rev = "65c87588ce2d915f3095b9c077447c23ce4406b0", default-features = false, features = ["vst3"] }
slint-baseview = { path = "vendor/slint-baseview" }
slint = { version = "=1.16.1", default-features = false, features = ["std", "compat-1-2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
slint-build = "=1.16.1"

[lints.clippy]
needless_range_loop = "allow"
manual_is_multiple_of = "allow"
unusual_byte_groupings = "allow"
redundant_closure = "allow"
needless_borrow = "allow"

[workspace]
members = ["xtask"]

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1

[dev-dependencies]
slint = { version = "=1.16.1", default-features = false, features = ["std", "compat-1-2", "renderer-software"] }
